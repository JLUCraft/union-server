name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/union-server
    steps:
      # Shared contracts come from the sibling central service checkout.
      - uses: actions/checkout@v7
        with:
          path: workspace/union-server

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/union-skinstation
          ref: refactor/central-skinstation-p0
          path: workspace/union-skinstation

      - uses: actions/checkout@v7
        with:
          repository: JLUCraft/minecraftd
          path: workspace/minecraftd

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/union-server -> target

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
