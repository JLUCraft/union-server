[package]
name = "league"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
state = { path = "../../../union-core/crates/state" }
protocol = { path = "../../../union-core/crates/protocol" }
identity = { path = "../../../union-core/crates/identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11" }
office-events = { package = "events", path = "../../../union-core/crates/events" }
client = { path = "../../../union-core/crates/client" }
flows = { path = "../../../union-core/crates/flows" }
authority = { path = "../../../union-core/crates/authority" }
node = { path = "../../../union-core/crates/node" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
