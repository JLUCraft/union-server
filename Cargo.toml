[package]
name = "federated-server"
default-run = "federated-server"
version = "0.2.0"
edition = "2024"
authors = ["JLUCraft"]
description = "Central Minecraft gateway with skin station scoring and activity adapters"
license = "GPL-3.0-only"
repository = "https://github.com/JLUCraft/federated-server"
publish = false

[dependencies]
base64 = "0.22"
aes = "0.8"
cfb8 = "0.8"
rsa = "0.9"
sha1 = "0.11"
flate2 = "1"
hmac = "0.13"
sha2 = "0.11"
uuid = { version = "1", features = ["serde"] }
serde_json = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
subtle = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
reqwest = { version = "0.13", features = ["json", "query"] }
regress = "0.11"
futures = "0.3"
minecraftd = { path = "../minecraftd" }
rusqlite = { version = "0.42", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
typify = "0.6"
syn = { version = "2", features = ["full", "visit-mut"] }
prettyplease = "0.2"

[[bin]]
name = "federated-server"
path = "src/main.rs"
